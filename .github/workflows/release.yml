name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, a bump type, or "auto"
        required: false
        default: auto
      merge_target:
        description: Target branch to merge into
        required: false
      force:
        description: Force a release even when there are release blockers
        required: false
        default: 'false'

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: getsentry/craft@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          version: ${{ inputs.version }}
          merge_target: ${{ inputs.merge_target }}
          force: ${{ inputs.force }}
          publish_repo: self
