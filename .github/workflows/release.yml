name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, a bump type, or "auto"
        required: false
        default: auto
      merge_target:
        description: Target branch to merge into
        required: false
      force:
        description: Force a release even when there are release blockers
        required: false
        default: 'false'

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  prepare:
    uses: getsentry/craft/.github/workflows/release.yml@v2
    with:
      version: ${{ inputs.version }}
      merge_target: ${{ inputs.merge_target }}
      force: ${{ inputs.force }}
      publish_repo: self
    secrets: inherit
