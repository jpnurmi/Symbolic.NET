name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish
        required: true

permissions:
  actions: read
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Craft
        run: npm install --global @sentry/craft@2

      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: jpnurmi

      - name: Publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NUGET_API_TOKEN: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: craft publish "${{ inputs.version }}" --no-input
